models:
  - name: stg_customers
    description: One row per loyalty-card holder, cleaned up.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: email
        description: Needed for receipts and the newsletter.
        data_tests: [not_null]
      - name: country
        data_tests:
          - accepted_values:
              arguments:
                values: ['FR', 'DE', 'NL', 'BE', 'ES', 'IT', 'GB']

  - name: stg_orders
    description: One row per order.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: status
        description: '`placed` → `shipped` → `completed`, or `returned`.'
        data_tests:
          - accepted_values:
              arguments:
                values: ['placed', 'shipped', 'completed', 'returned']

  - name: stg_payments
    description: One row per payment, amounts in euros.
    columns:
      - name: payment_id
        data_tests: [unique, not_null]
      - name: payment_method
        data_tests:
          - relationships:
              arguments:
                to: ref('payment_methods')
                field: payment_method
      - name: amount
        description: Euros; refunds are separate rows in the till, never negative here.
